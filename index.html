<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131a1b"><title>Athenaion Light</title>
<meta name="athenaion-release" content="v4">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head><body>
<main id="loading" aria-live="polite"><div class="loading-card">
<p class="eyebrow">ATHENAION LIGHT · V4</p>
<h1>Athenaion <span>Light</span></h1>
<p id="load-stage">3Dを準備しています</p>
<progress id="load-progress" max="20" value="0" aria-label="読み込みの進行"></progress>
<p id="load-detail">風景のデータを読み込み、最初の画面を描いています。</p>
<button id="retry" type="button" hidden>もう一度読み込む</button>
<button id="copy-error" type="button" hidden>診断情報をコピー</button>
</div></main>
<header id="brand" hidden><strong>ATHENAION <span>LIGHT</span></strong><small id="status">準備中</small></header>
<nav id="controls" aria-label="風景と描画の設定" hidden>
<label>風景<select id="shot" aria-label="風景を選ぶ"></select></label>
<label>描画<select id="profile" aria-label="描画の設定"><option value="auto">自動</option><option value="quality">画質優先</option><option value="fast">軽さ優先</option></select></label>
<button id="motion" type="button" aria-pressed="false">動きをつける</button>
<button id="reset" type="button">視点を戻す</button>
<button id="fullscreen" type="button">全画面</button>
<button id="help-toggle" type="button" aria-expanded="false" aria-controls="help">?</button>
</nav>
<aside id="help" hidden><strong>風景の中を移動</strong>
<p>ドラッグで回転 · ホイールでズーム<br>右ドラッグ／2本指で平行移動<br>W A S Dで移動 · Q Eで上下 · Shiftで速く<br>1〜9で風景を切り替え</p>
<p>操作中は描画を軽くし、止めると細部を仕上げます。重い場合は「軽さ優先」を選んでください。</p>
<p class="credit">Original world: <a href="https://github.com/Leonxlnx/athenaion" target="_blank" rel="noopener noreferrer">Leonxlnx / Athenaion</a> · MIT License</p></aside>
<noscript>この3D作品を表示するにはJavaScriptを有効にしてください。</noscript>
<script type="module" src="./src/main.js"></script>
</body></html>
